[manifest]
version = "0.1.0"
dump_lua = true
priority = 0

# massive thanks to ElleJokers

# Add debug give for characters
[[patches]]
[patches.pattern]
target = "engine/controller.lua"
pattern = 'if key == "3" then'
position = "after"
payload = '''
if _card.ability.set == 'synthb_Character' and G.synthb_character_area then
    SMODS.add_card({area = G.synthb_character_area, key = _card.config.center.key})
    _card:set_sprites(_card.config.center)
end
'''
match_indent = true

# Add character calculation
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "-- TARGET: add your own CardAreas for joker evaluation"
position = "after"
payload = '''
table.insert(t,1,G.synthb_character_area)
'''
match_indent = true

# Add characters appearing in shop
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = "for _,v in ipairs(SMODS.ConsumableType.obj_buffer) do"
position = "before"
payload = 'total_rate = total_rate + G.GAME.synthb_character_rate'
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = "for _, v in ipairs(rates) do"
position = "before"
payload = "table.insert(rates, {type = 'synthb_Character', val = G.GAME.synthb_character_rate})"
match_indent = true

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils/weights.lua"]'
pattern = "for _,v in ipairs(SMODS.ConsumableType.obj_buffer) do"
position = "before"
payload = "args.types[#args.types + 1] = 'synthb_Character'"
match_indent = true

# Put characters in the correct area when buying from the shop
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.jokers:emplace(c1)"
position = 'at'
payload = '''
if c1.ability.set == "synthb_Character" then
    G.synthb_character_area:emplace(c1)
else
    G.jokers:emplace(c1)
end
'''
match_indent = true

# Let characters get debuffed by blinds
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "--add new debuffs"
position = 'after'
payload = '''
for _, v in ipairs(G.synthb_character_area.cards) do
    if not reset then self:debuff_card(v, true) end
end
'''
match_indent = true