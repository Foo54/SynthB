# sixth sense
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''context.full_hand[1].sixth_sense = true'''
position = 'at'
payload = '''context.full_hand[1].sixth_sense = not SMODS.calculate_context({prevent_destroy_card = context.full_hand[1]}).prevent_destroy'''
match_indent = true

# trading card
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''remove = true,'''
position = 'at'
payload = '''remove = not SMODS.calculate_context({prevent_destroy_card = context.full_hand[1]}).prevent_destroy,'''
match_indent = true
